[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-culler"
version = "0.2.0.dev1"
description = "Headless offline CLI image culling engine with GUI-ready callbacks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "Pillow>=10.0",
  "scikit-learn>=1.3",
  "scipy>=1.6",
  "onnxruntime>=1.16",
  "tokenizers>=0.15",
  "bracketeering[pixels] @ git+https://github.com/tylermcm/bracketeering@ccr-fd1f1f35-hi49ff",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
]
# The models' runtime (same minimums as the image-triage app's managed AI runtime locks). The model files
# themselves are never downloaded here: they come from the app's install (ModelRegistry.from_app_manifest).
models = [
  "torch>=2.9",
  "timm>=1.0.28",
  "einops>=0.8.2",
  "transformers>=5.14.1",
  "mediapipe>=0.10.35",
]

[project.scripts]
ai-culler = "aiculler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
